service:
  name: borrow-eligibility-service
  namespace: 105250-borrow
  category: S1
  sealId: "105250"
  tribe: Borrow
  squad: BW_LON16A_BorrowMoney_Origination
  manager: helm

image:
  repository: dockerdev.artifactory.dyn.prd.aws.jpmchase.net/dynamo-services
  tag: <+serviceVariables.chartVersion>

resources:
  maxUnavailable: 1
  replicas: 1
  requests:
    cpu: "500m"
    memory: "1.5Gi"
  limits:
    memory: "1.5Gi"

jvm:
  maxHeapSize: "512m"
  minHeapSize: "512m"
  options: "-XX:+UseG1GC"

deployment:
  maxSurge: 100%

runAsNonRoot: true
fsGroup: 999
terminationDrainDuration: 10s

test:
  allowed: false

env:
  - name: BOOTSTRAP_SERVERS
    value: "core-kafka.105250-kafka.svc.cluster.local:9092"
  - name: SCHEMA_REGISTRY_URL
    value: "https://core-schema-registry.105250-kafka.svc.cluster.local:8081"
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://cockroach-public:26257/borrow_eligibility_service?\
            ApplicationName=borrow-eligibility-service&\
            tcpKeepAlive=true&\
            sslmode=verify-full&\
            sslrootcert=/certs/ca.crt&\
            sslcert=/certs/tls.crt&\
            sslkey=/certs/key.der&\
            gssEncMode=disable"
  - name: SPRING_DATASOURCE_USERNAME
    value: "borrow_eligibility_service"
  - name: SPRING_ZIPKIN_BASEURL
    value: "http://jaeger.105250-core-eng-platform.svc.cluster.local/"
  - name: SPRING_TASK_SCHEDULING_POOL_SIZE
    value: "{{ .Values.task.scheduling.pool.size }}"
