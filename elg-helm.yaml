apiVersion: v2
description: A Helm chart for borrow-eligibility-service
name: borrow-eligibility-service
dependencies:
  - name: icb-labels
    version: ~0.2.0
    repository: https://artifactory.dyn.prd.aws.jpmchase.net/artifactory/helmdev
version: 1.0.0




apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.service.namespace }}
  labels:
    {{- with .Values }}
      {{- include "icb-labels.labels" . | nindent 4 }}
    {{end}}
spec:
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - "/actuator/info"
              - "/actuator/health*"
              - "/actuator/prometheus"
            ports:
              - "9090"
        {{- if .Values.istio.allowed }}
        {{ tpl (toYaml .Values.istio.allowed) . | nindent 8 }}
        {{- end }}
    - from:
        - source:
            requestPrincipals:
              - dynamo-api-gateway.jpmorgan.com/*
              - tenx-platform.com/*
      to:
        - operation:
            methods: [ "GET" ]
            paths: [ "/api/v1/borrow/eligibility/*" ]
            ports:
              - "8080"
    - from:
        - source:
            principals: [ "cluster.local/ns/105250-orchestration-onboarding/sa/orchestration-onboarding" ]
      to:
        - operation:
            methods: [ "POST" ]
            paths: [ "/api/v1/borrow/eligibility/create-account" ]
            ports:
              - "8080"
    - from:
        - source:
            principals: [ "cluster.local/ns/105250-orchestration-onboarding/sa/orchestration-onboarding" ]
      to:
        - operation:
            methods: [ "PATCH" ]
            paths: [ "/api/v1/borrow/eligibility/*" ]
            ports:
              - "8080"
    {{- if .Values.test.allowed }}
    - from:
        - source:
            principals: [ "cluster.local/ns/105250-borrow/sa/borrow-test-proxy-service" ]
      to:
        - operation:
            methods: [ "POST" ]
            paths: [ "/api/v1/borrow/eligibility/create-account" ]
            ports:
              - "8080"
    {{- end }}
    - from:
        - source:
            principals:
              - cluster.local/ns/105250-customer-graph/sa/graph-gateway-service
      to:
        - operation:
            methods:
              - "POST"
              - "GET"
            paths:
              - "/graphql*"
            ports: [ '8080' ]
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.service.name }}




apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.service.namespace }}
  annotations:
    dynamo.certificate.tls/active: "false"
    pca.icb.tls/active: "true"
  labels:
    {{- with .Values }}
      {{- include "icb-labels.labels" . | nindent 4 }}
    {{end}}
spec:
  replicas: {{ .Values.resources.replicas }}
  progressDeadlineSeconds: 540
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.service.name }}
  template:
    metadata:
      labels:
      {{- with .Values }}
        {{- include "icb-labels.labels" . | nindent 8 }}
      {{end}}
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true,"terminationDrainDuration":"{{ .Values.terminationDrainDuration }}"}'
        {{- if .Values.istio.excludeOutboundPorts }}
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.service.name }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Values.service.name }}
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: service
          image: "{{ .Values.image.repository }}/{{ .Values.service.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-actuator
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "{{ .Values.resources.requests.cpu }}"
              memory: "{{ .Values.resources.requests.memory }}"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: "9090"
            - name: SERVER_PORT
              value: "8080"
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: REGIONAL
          {{- if .Values.env }}
          {{ tpl (toYaml .Values.env) . | nindent 12}}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.service.name }}




apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.service.name }}"
  namespace: "{{ .Values.service.namespace }}"
  labels:
    {{- with .Values }}
      {{- include "icb-labels.labels" . | nindent 4 }}
    {{end}}
    component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/upstream-vhost: "{{ .Values.service.name }}.{{ .Values.service.namespace }}.svc.cluster.local"
spec:
  rules:
    - host: "{{ .Values.gatewayIngress.host }}"
      http:
        paths:
          - path: "/{{ .Values.service.name }}(/|$)(.*)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: "{{ .Values.service.name }}"
                port:
                  number: 80
  tls:
    - hosts:
        - "{{ .Values.gatewayIngress.host }}"







