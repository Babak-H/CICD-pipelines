kafka:
  listeners:
    concurrency: 1
    autoOffsetReset: earliest
    groupId: borrow-eligibility-service
    creditcard:
      eligibility:
        concurrency: 1
      applicationRequest:
        concurrency: 1
    loan:
      eligibility:
        concurrency: 1
      application:
        concurrency: 1
  recovery:
    partitions: 3
  triage:
    partitions: 3
  retry:
    main:
      maxAttemptsCount: 1
      backoffInterval: 500ms
    recovery:
      maxAttemptsCount: 3
      backoffInterval: 500ms


istio:
  excludeOutboundPorts: 26257,8133

logging:
  level:
    temporal: INFO

encryption:
  incomeExpenseFields:
    enabled: true
    kmsKey: "arn:aws:kms:eu-west-1:279924677952:key/db2dbb13-e3e7-4a31-853d-6cf2aefc91c2"
  cache:
    # refresh cache every 10 mins
    refreshIntervalMillis: 600000
    # initial delay in ms after application start up - 0 secs(default)
    initialDelayMillis: 0

temporal:
  target: borrow-temporal.105250-borrow-temporal.svc.cluster.local:8133
  namespace: borrow
  ssl_enabled: true
  encryption:
    enabled: false
  workerFactory:
    maxWorkflowThreadCount: 600 # sdk default value: 600, Maximum number of threads available for workflow execution across all workers created by the Factory. This includes cached workflows.
    workflowCacheSize: 600 # workflow cache size used across all workers in this JVM instance
  defaultWfWorker:
    maxConcurrentWorkflowTaskPollers: 5 # sdk default value: 5
    maxConcurrentWorkflowTaskExecutionSize: 200 # sdk default value: 200
    deadlockDetectionTimeoutMs: 2000 # sdk default value: 1000 ms
  defaultActWorker:
    maxConcurrentActivityTaskPollers: 5 # sdk default value: 5
    maxConcurrentActivityExecutionSize: 200 # sdk default value: 200
    maxConcurrentLocalActivityExecutionSize: 200 # sdk default value: 200
  defaultActOptions:
    startToCloseTimeoutSecs: 60
    retry:
      initialIntervalMs: 100
      maximumIntervalSecs: 10
      backoffCoefficient: 2
      maximumAttempts: 3

zipkin:
  enabled: true

kafkaacl:
  enabled: true

db:
  maxretry: 3
  retryInterval: 10ms

api:
  maxretry: 3
  retryInterval: 100ms

task:
  scheduling:
    pool:
      size: 5

warmup:
  enabled: true

loan:
  enabled: true

jwt:
  icbJwkEnabled: false
