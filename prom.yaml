temporal_workflow_endtoend_latency_seconds_bucket{app="borrow-collections-service"} => gives you metric and its labels based on how often the app is scraped

rate(temporal_workflow_endtoend_latency_seconds_bucket{app="borrow-collections-service"}[15m]) => divides the vector results into 15m intervals and calculates the rate for each of them

sum(rate(temporal_workflow_endtoend_latency_seconds_bucket{app="borrow-collections-service"}[15m])) => sums up all of rate of the metric over the 15m intervals



sum without(instance, pod) (http_server_requests_seconds_bucket{app="borrow-line-manager", uri="/api/v1/borrow/revolving-lines", method="PUT", status="200", le="+Inf"})

http_server_requests_seconds_bucket{app="borrow-line-manager", uri="/api/v1/borrow/revolving-lines", method="PUT", status="200", le="+Inf"} => This is a metric that measures the duration of HTTP requests in seconds. It's a histogram metric where the le label indicates the upper bound of the histogram bucket

sum without(instance, pod) (...) => The sum function is an aggregator that sums up all the values in the specified range. The without clause removes the listed labels (instance and pod in this case) from the result. So, this part of the query is summing up all the values of the filtered metric, but it's doing so in a way that doesn't distinguish between different instances or pods. This means that the result will be the total count of HTTP requests matching the specified criteria across all instances and pod
