Example prometheus queries:

http_requests_total  : time series with total of http requests

http_requests_total{job="apiserver", hanlder="/api/comments"}  : for job that is apiserver and handler that is /api/comments give the total http requests

http_requests_total{job="apiserver", hanlder="/api/comments"}[5m]  : same as above but for the range of last 5 minutes

http_requests_total{environment=~"staging|testing|development",method!="GET"}  : we can have one of several environments and method NOT "GET"

prometheus_http_requests_total{code=~"2.*|4.*"}

http_requests_total{job=~".*server"}  : for all jobs that end with "server" give back http_requests_total metric

http_requests_total{status!~"4.."}  : select all HTTP status codes except 4xx ones

rate(http_requests_total[5m]) : Return the per-second rate for all time series with the http_requests_total, measured over the last 5 minutes

sum by (job) (rate(http_requests_total[5m]))  : sum up all the rates over last 5 minutes, grouping by job value

rate(http_requests_total[5m])[30m:1m]  : Return the 5-minute rate of the http_requests_total metric for the past 30 minutes, with a resolution of 1 minute

(instance_memory_limit_bytes - instance_memory_usage_bytes) / 1024 / 1024  : metrics with the same dimensional labels, we can apply binary operators to them and elements on both sides with the same label set will get matched and propagated to the output

topk(3, sum by (app, proc) (rate(instance_cpu_time_ns[5m])))  : we could get the top 3 CPU users grouped by application (app) and process type (proc) 

node_cpu_seconds_total{cpu="0"}[2m]  : show the total amount of CPU time spent over the last two minutes on cpu 0

sum by (namespace) (kube_pod_info)  : total pod count per namespace

sum(kube_pod_container_resource_limits{resource="cpu"}) - sum(kube_node_status_capacity{resource="cpu"})  : cpu overcommitment in the cluster

sum(kube_pod_container_resource_limits{resource="memory"}) - sum(kube_node_status_capacity{resource="memory"})  : memory over commitment

min_over_time(range-vector): the minimum value of all points in the specified interval

min_over_time(sum by (namespace, pod)
    (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"})[15m:1m]) > 0  : Find unhealthy Kubernetes pods


increase(v range-vector) calculates the increase in the time series in the range vector. The increase is extrapolated to cover the full time range as specified in the range vector selector, 
so that it is possible to get a non-integer result even if a counter increases only by integer increments.

increase(http_requests_total{job="api-server"}[5m])
increase(kube_pod_container_status_restarts_total[15m]) > 3

count by (namespace)(sum by (namespace,pod,container)(kube_pod_container_resource_limits{resource="cpu"}))  : total number of pods in each namespace that have cpu limiys

count by (namespace)(sum by (namespace,pod,container)(kube_pod_container_info{container!=""}) unless sum by (namespace,pod,container)(kube_pod_container_resource_limits{resource="cpu"}))  : Find the number of containers without CPU limits in each namespace

kube_persistentvolumeclaim_status_phase{phase="Pending"}  : Find PersistentVolumeClaim in the pending state

count by (namespace)(kube_persistentvolumeclaim_status_phase{phase="Pending"})  : count them in each namespace

sum(changes(kube_node_status_condition{status="true",condition="Ready"}[15m])) by (node) > 2  : find nodes that are intermittently switching between “Ready" and “NotReady" status continuously over 15 minutes

sum((container_memory_usage_bytes{container!="POD",container!=""} - on (namespace,pod,container) avg by (namespace,pod,container)(kube_pod_container_resource_requests{resource="memory"})) * -1 >0 ) / (1024*1024*1024)  : Find idle memory

avg(container_memory_working_set_bytes{container!="POD",container!=""}) by (namespace)  : averge memory usage by pods in each namespace

sum(kube_node_status_condition{condition="Ready",status="true"})  : find number of nodes that are ready

node_filefd_allocated{k8scluster="my-cluster"}  : fetch the number of allocated file descriptors for a specific Kubernetes cluster named "my-cluster".

node_filefd_allocated  : This is a metric exposed by the Node Exporter, a Prometheus exporter for hardware and OS metrics. It represents the number of file descriptors currently allocated by the system


