apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: hault
  namespace: {{ .Values.namespace }}
  labels:
  {{- with .Values }}
  {{- include "icb-labels.labels" . | nindent 4 }}
  {{end}}
spec:
  {{- if .Values.haultAnnotations }}
  annotations:
  {{ toYaml .Values.haultAnnotations | indent 4 }}
  {{- end }}
  vaultConfigurerAnnotations:
    dynamo.certificate.tls/active: "false"
  {{ if .Values.localStorage  }}
  size: 1
  {{ else }}
  size: 3
  {{ end }}
  bankVaultsImage: "dockerprod.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.io/banzaicloud/bank-vaults:1.11.2"
  statsdDisabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  vaultLabels:
    haultPod: "true"
    icb.jpmorgan.com/squad: ICB_Ledgers

  podAntiAffinity: topology.kubernetes.io/zone

  config:
    api_addr: {{ .Values.apiAddr }}
    cluster_addr: {{ .Values.clusterAddr }}
    log_requests_level: trace

    listener:
      tcp:
        address: 0.0.0.0:8200
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
        telemetry:
          unauthenticated_metrics_access: true
    {{- if not .Values.localStorage  }}
    disable_clustering: false
    ha_storage:
      {{- if eq "raft" .Values.ha_storage }}
      raft:
        path: /vault/raft/
      {{- else if eq "cockroachdb" .Values.ha_storage }}
      cockroachdb:
        connection_url: "postgresql://hault@cockroach-public:26257/hault?sslmode=verify-full&sslrootcert=/cockroach/cdb/ca.crt&sslcert=/cockroach/cdb/client.hault.crt&sslkey=/cockroach/cdb/client.hault.key&connect_timeout=120&fallback_application_name=${.Env.POD_NAME}"
        ha_enabled: true
        ha_table: vault_ha_locks
      {{- end }}
    storage:
      cockroachdb:
        # possible connection string options https://pkg.go.dev/github.com/lib/pq#hdr-Connection_String_Parameters
        connection_url: "postgresql://hault@cockroach-public:26257/hault?sslmode=verify-full&sslrootcert=/cockroach/cdb/ca.crt&sslcert=/cockroach/cdb/client.hault.crt&sslkey=/cockroach/cdb/client.hault.key&connect_timeout=120&fallback_application_name=${.Env.POD_NAME}"
        table: "vault_kv_store"
    {{- else }}
    disable_clustering: true
    storage:
      file:
        path: /vault/raft/
    {{- end }}

    telemetry:
      disable_hostname: true
      prometheus_retention_time: 24h

    ui: true
    disable_mlock: true

  envsConfig: # this might not be needed any more ...This is for Bank Vault
    - name: AWS_STS_REGIONAL_ENDPOINTS
      value: regional
    - name: AWS_REGION
      value: "{{ .Values.region }}"
    - name: AWS_DEFAULT_REGION
      value: "{{ .Values.region }}"
    {{- if .Values.localStorage  }}
    - name: VAULT_SKIP_VERIFY
      value: "true"
    {{- end }}


  #Hault Configs like Secrets,k8s-Auth Methods...
  externalConfig:
    policies:
      - name: vault-account-rotator-bootstraper-policy
        rules:  |
          path "secret/dev/*" {
          capabilities = ["read", "list"]
          }
          path "sys/policy/*" {
          capabilities = [ "read" ]
          }
          path "auth/kubernetes/role/*" {
          capabilities = [ "read" ]
          }
          path "auth/token/lookup-self" {
          capabilities = ["read"]
          }
      - name: vault-installer-policy
        rules: |
          path "secret/*" {
          capabilities = ["create", "read", "update", "delete", "list"]
          }
          path "sys/policy/*" {
          capabilities = ["create", "read", "update", "delete"]
          }
          path "auth/kubernetes/role/*"{
          capabilities = ["create", "read", "update", "delete"]
          }
          path "auth/token/lookup-self" {
          capabilities = ["read"]
          }
      - name: vault-monitor-policy
        rules: |
          path "secret/*" {
          capabilities = ["read", "list"]
          }
          path "sys/policy/*" {
          capabilities = [ "read" ]
          }
          path "auth/kubernetes/role/*"{
          capabilities = [ "read" ]
          }
          path "auth/token/lookup-self" {
          capabilities = ["read"]
          }
    auth:
      - type: kubernetes
        config:
          disable_iss_validation: true
        roles:
          # allow sa for token rotator to access the specific secret it needs
          - name: vault-service-account-rotator-role
            bound_service_account_names: [ "vault-service-account-token-rotator" ]
            bound_service_account_namespaces: [ "105250-core-vault-token-rotation" ]
            policies: [ "vault-account-rotator-bootstraper-policy" ]
            ttl: 2h
          # Allow every pod in the default namespace to use the secret kv store
          - name: vault-installer-role
            bound_service_account_names: [ "vault-installer-sa" ]
            bound_service_account_namespaces: [ "105250-core-vault" , "105250-vault-operators" ]
            policies: [ "vault-installer-policy" ]
            ttl: 2h
          - name: vault-operator-role
            bound_service_account_names: [ "vault-operator-sa", "vault-init-sa", "vault-tools-sa" , "vault-rds-init-sa"]
            bound_service_account_namespaces: [ "105250-vault-operators" ]
            policies: [ "vault-installer-policy" ]
            ttl: 2h
          # Allow tm_vault_monitoring sa in icb-ledgers namespace
          - name: vault-monitor-role
            bound_service_account_names: [ "vault-monitor-sa" ]
            bound_service_account_namespaces: [ "icb-ledgers-mon" ]
            policies: [ "vault-monitor-policy" ]
            ttl: 2h
    secrets:
      - options:
          version: 1
        path: secret
        type: kv
  image: "dockerprod.artifactory.dyn.prd.aws.jpmchase.net/{{ .Values.haultImageRepoLocation }}:{{ .Values.haultImageRepoTag}}"
  existingTlsSecretName: hault-vault-key
  resources:
    bankVaults:
      limits:
        cpu: 600m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 50Mi
    vault:
      limits:
        cpu: "1"
        memory: 4Gi
      requests:
        cpu: 10m
        memory: 256Mi

  #Hault Env Config
  vaultEnvsConfig:
    - name: "SKIP_CHOWN"
      value: "true"
    - name: "SKIP_SETCAP"
      value: "true"
    - name: VAULT_LOG_LEVEL
      value: trace
    {{ if .Values.localStorage  }}
    - name: VAULT_SKIP_VERIFY
      value: "true"
    {{ end }}
  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        storageClassName: "gp2-generic-encrypted-wfc"
        accessModes:
          - ReadWriteOnce
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi

  volumeMounts:
    {{ if not .Values.localStorage  }}
    - name: vault-raft
      mountPath: /vault/raft/
    - name: cockroach
      mountPath: /cockroach
    {{ else }}
    # Use local disk to store Vault file data, see config section.
    - name: vault-raft
      mountPath: /vault/raft/
    {{ end }}

  serviceAccount: core-hault
  serviceType: ClusterIP

  {{ if not .Values.localStorage }}
  unsealConfig:
    aws:
      kmsKeyId: {{ .Values.unsealConfig.aws.kmsKeyId }}
      kmsRegion: {{ .Values.unsealConfig.aws.kmsRegion }}
      s3Bucket: {{ .Values.unsealConfig.aws.s3Bucket }}
      s3Prefix: ''''
      s3Region: {{ .Values.unsealConfig.aws.s3Region | default "eu-west-1" }}
      s3SSE: {{ .Values.unsealConfig.aws.s3SSE }}
  {{ else }}
  # Describe where you would like to store the Vault unseal keys and root token.
  unsealConfig:
    options:
      # The preFlightChecks flag enables unseal and root token storage tests
      # This is true by default
      preFlightChecks: true
    kubernetes:
      secretNamespace: {{ .Values.namespace }}
  {{ end }}
  #  #Dev Env:- Unseal keys stored in K8s Secrets
  #  unsealConfig:
  #    kubernetes:
  #      secretNamespace: 105250-core-hault
  {{ if not .Values.localStorage }}
  vaultInitContainers:
    - name: cockroach-cert-copy
      image: dockerprod.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.io/banzaicloud/bank-vaults:1.11.2
      command: [ "/bin/sh" ]
      args:
        - "-ecx"
        - >-
          mkdir -p /cockroach/cdb;
          chmod 700 /cockroach/cdb;
          cp /cdb/client/* /cockroach/cdb/;
          chown -R 1000:1000 /cockroach/*;
          chmod 500 /cockroach/cdb/*;
      volumeMounts:
        - name: cockroach
          mountPath: /cockroach
        - name: cdb-cert
          mountPath: /cdb
      resources:
        limits:
          memory: "100Mi"
          cpu: "50m"
        requests:
          memory: "50Mi"
          cpu: "10m"
  volumes:
    - name: cockroach

  {{ end }}





