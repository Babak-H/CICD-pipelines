apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.service.name }}-job-{{ randAlphaNum 4 | lower }} # with 6 we have a problem in the certification generation as the name is too big
  namespace: {{ .Values.namespace.operators }}
  annotations:
  {{- if .Values.pcaCertEnabled }}
    pca.icb.tls/active: "true"
    dynamo.certificate.tls/active: "false"
    dynamo.certificate.cdb/active: "false"
  {{ else }}
    dynamo.certificate.tls/active: "true"
  {{ end }}
  labels:
    {{- with .Values }}
      {{- include "icb-labels.labels" . | nindent 4 }}
    {{ end }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      priorityClassName: platform-critical
      restartPolicy: Never
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsUser: 999
      serviceAccountName: {{ .Values.prerequisitesDeploymentServiceAccount.name }}
      automountServiceAccountToken: true
      volumes:
        - name: tmp-volume
          emptyDir: { }
      containers:
        - name: vault-init
          resources:
            requests:
              memory: {{ .Values.memory.request }}
              cpu: {{ .Values.cpu.request }}
            limits:
              memory: {{ .Values.memory.limit }}
          image: {{ .Values.image.host }}/dynamo-services/icb-ledgers-vault-tools:{{ .Values.vaultToolsImageTag }}
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
          command: [ "/bin/bash" ]
          args:
            - "-ecx"
            - |

              # Mount kubeconfig
              mkdir ~/.kube;
              bash /scripts/build-kubeconfig.sh ~/.kube/config;
              kubectl config get-contexts;
              
              # Downloading the required artifacts and vaultctl binary
              mkdir -p /tmp/tm-operator/generated-resources/operator-prerequisites && cd /tmp/tm-operator;
              cp /release-artifacts/vaultctl .;
              cp /release-artifacts/vault-{{ .Values.vaultVersion }}.release .;
              chmod 700 vaultctl;

              ./vaultctl version;
              
              # Generating the example values file basing on the list of components to be installed
              ./vaultctl example-values \
                -r vault-{{ .Values.vaultVersion }}.release {{ join " " .Values.componentsToBeInstalled }} \
                > /tmp/tm-operator/generated-resources/{{ .Values.vaultVersion }}-example-values.yaml;
              
              {{ if eq .Values.dumpResourcesToBeInstalled "false" }}
              # If new operators will be deployed, remove the currently deployed instances
              kubectl delete deployment crown-operator -n $OPERATORS_NAMESPACE --ignore-not-found=true;
              kubectl delete deployment tmcomponent-operator -n $OPERATORS_NAMESPACE --ignore-not-found=true;
              {{ end }}
              
              # Deploy crown and tmcomponent operator deployments or dump the resources to be deployed into the specific directory
              ./vaultctl init-operators \
                -d {{ .Values.image.host }}/container-external/docker.external.thoughtmachine.io \
                --context inCluster --cloud-provider=aws --distribution=eks \
                --crown-operator-namespace=$OPERATORS_NAMESPACE \
                --crown-operator-service-account={{ .Values.operatorsPrerequisites.vaultOperatorsServiceAccount.name }} \
                --tmcomponent-operator-namespace=$OPERATORS_NAMESPACE \
                --tmcomponent-operator-service-account={{ .Values.operatorsPrerequisites.vaultOperatorsServiceAccount.name }} \
                --check-vault-role-name={{ .Values.operatorsPrerequisites.checkVaultRole }} \
                --check-vault-role-binding={{ .Values.operatorsPrerequisites.checkVaultRoleBinding }} \
                --istio-role-name={{ .Values.operatorsPrerequisites.istioRole }} \
                --istio-role-binding={{ .Values.operatorsPrerequisites.istioRoleBinding }}{{ if eq .Values.dumpResourcesToBeInstalled "true" }} \
                --export-dir=/tmp/tm-operator/generated-resources/operator-prerequisites{{ end }};
              
              {{ if eq .Values.dumpResourcesToBeInstalled "true" }}
              sleep 7200
              {{ end }}

          env:
            - name: CLOUD_PROVIDER
              value: AWS
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
            - name: AWS_REGION
              value: {{ .Values.region }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.region }}
            - name: OPERATORS_NAMESPACE
              value: {{ .Values.namespace.operators }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 10"    




