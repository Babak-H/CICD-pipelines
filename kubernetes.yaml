  {{end}}
{{- if .Values.service.annotations }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.externalPort }}
    targetPort: {{ .Values.service.internalPort }}
    protocol: TCP
    name: http
  - port: 9091
    protocol: TCP
    name: http-actuator
  selector:
    app.kubernetes.io/name: {{ include "vault-operator.name" . }}





# Default values for vault-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: 105250-core-hault

replicaCount: 1

image:
  bankVaultsRepository: "dockerprod.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.io/banzaicloud/bank-vaults"
  repository: "dockerprod.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.io/banzaicloud/vault-operator"
  vaultOperator: "dockerprod.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.io/banzaicloud/vault-operator"
  vaultOperatorTag: "1.11.2"
  pullPolicy: IfNotPresent
  tag:
  imagePullSecrets: [ ]  # global.imagePullSecrets is also supported

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 8080
  name: hault-operator
  tribe: ICB_Ledgers
  squad: ICB_Ledgers
  sealId: "105250"
  tag: 1.0.0

nameOverride: "hault-operator"
fullnameOverride: "hault-operator"

crdAnnotations: { }


# The namespace where the operator watches for vault CRD objects, if not defined
# all namespaces are watched
watchNamespace: "105250-core-hault"
syncPeriod: "1m"

# # If needed, define nodeSelector for vault operator
# nodeSelector:
#   "node-role.kubernetes.io/custom_worker": "true"

# # if tolerations are used inside cluster, define tolerations as well
# tolerations:
#   - effect: NoSchedule
#     key: node_role
#     operator: Equal
#     value: custom_worker

labels: { }
#  team: banzai

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

affinity: { }

## Assign a PriorityClassName to pods if set
priorityClassName: ""

terminationGracePeriodSeconds: 10

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1
readinessProbe:
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 1

etcd-operator:
  enabled: false
  etcdOperator:
    commandArgs:
      cluster-wide: true
      create-crd: false

psp:
  enabled: false
  vaultSA: "vault"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""






