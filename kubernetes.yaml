kind: Job
metadata:
  labels:
    job_purpose: tm-config
    {{- include "microservice-base.labels" . | nindent 4 }}
  name: {{ .Values.jobName }}
  namespace: {{ .Values.namespace }}
  annotations:
    dynamo.certificate.tls/active: "false"
    dynamo.certificate.cdb/client: "false"
    pca.icb.tls/active: "false"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        job_purpose: tm-config
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Values.serviceAccount }}
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: tm-config-tool
          env:
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: regional
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.aws_region }}
            - name: AWS_REGION
              value: {{ .Values.aws_region }}
            - name: MANIFEST
              value: {{ .Values.manifest }}
            - name: DYNAMO_ACCOUNT_NAME
              value: {{ .Values.environment }}
            # DEFAULTS
            {{- if .Values.env }}
            {{ tpl (toYaml .Values.env) . | nindent 12 }}
            {{- end }}

            # OVERRIDES
            {{- if .Values.envExtra }}
            {{ tpl (toYaml .Values.envExtra) . | nindent 12 }}
            {{- end }}
          image: "{{ .Values.image.host}}/dynamo-services/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 400m
              memory: 500Mi
      restartPolicy: Never
  ttlSecondsAfterFinished: 180

