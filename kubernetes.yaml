apiVersion: batch/v1
kind: Job
metadata:
  name: vault-installer-debug
  namespace: 105250-core-vault
  annotations:
    dynamo.certificate.tls/active: "true"
  labels:
    createdBy: "Billy"
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      priorityClassName: platform-critical
      securityContext:
        fsGroup: 37100
        runAsGroup: 37100
        runAsUser: 37100
      serviceAccountName: vault-installer-sa
      automountServiceAccountToken: true
      volumes:
        - name: release-artifacts-volume
          emptyDir: { }
        - name: hecate-template-volume
          emptyDir: { }
        - name: config-templates-volume
          emptyDir: { }
        - name: tmp-volume
          emptyDir: { }
        - name: config
          configMap:
            name: vault-init
      containers:
        - name: vault-init
          resources:
            requests:
              memory: "200Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "800m"
          image: dockerdev.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.external.thoughtmachine.io/vault/installer/vault_installer_container:vault-3.3.3
          imagePullPolicy: "IfNotPresent"
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /release-artifacts
              name: release-artifacts-volume
            - mountPath: /release-artifacts/hecate-templates
              name: hecate-template-volume
            - mountPath: /release-artifacts/config-templates
              name: config-templates-volume
            - mountPath: /tmp
              name: tmp-volume
          command: [ "/bin/bash" ]
          args:
            - "-ecx"
            - >-
              cp /config/packages.txt /release-artifacts/packages.txt;

              sleep 300000;
          lifecycle:
            # as advised by Ahsan, adding this to cope with 5 second log scraping interval.
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 10"
          env:
            - name: AWS_REGION
              value: eu-west-1
            - name: AWS_DEFAULT_REGION
              value: eu-west-1
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
            - name: NAMESPACE
              value: 105250-core-vault
            - name: CONTAINER_REGISTRY
              value: dockerdev.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.external.thoughtmachine.io
            - name: MONITORING_NAMESPACE
              value: 105250-core-vault-monitoring
            - name: CROWN_WHITELIST_FILE
              value: /release-artifacts/packages.txt
            - name: CLOUD_PROVIDER
              value: AWS
      restartPolicy: Never
      initContainers:
        - name: copy-crown-packages
          image: dockerdev.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.external.thoughtmachine.io/vault/installer/crown_packages:vault-3.3.3
          command:
            - /bin/sh
            - -c
            - cp -r /release-artifacts/* /release-artifacts-output/
          volumeMounts:
            - mountPath: /release-artifacts-output
              name: release-artifacts-volume
          resources:
            requests:
              cpu: "0.1"
              memory: 100Mi
            limits:
              cpu: "0.3"
              memory: 100Mi
        - name: copy-config-templates
          image: dockerdev.artifactory.dyn.prd.aws.jpmchase.net/container-external/docker.external.thoughtmachine.io/instances/common/k8s/config_templates:vault-3.3.3
          command:
            - /bin/sh
            - -c
